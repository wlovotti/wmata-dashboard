# Documents the WMATA collector's current implicit settings. Consumed by
# scripts/stateless_collector.py (the multi-agency stateless-collector
# rewrite); the legacy scripts/continuous_combined_collector.py still
# doesn't read it.
name: wmata
display_name: WMATA Metrobus
timezone: America/New_York
api:
  key_env: WMATA_API_KEY
  auth: header
  trip_updates_url: https://api.wmata.com/gtfs/bus-gtfsrt-tripupdates.pb
  vehicle_positions_url: https://api.wmata.com/gtfs/bus-gtfsrt-vehiclepositions.pb
  extra_params: {}
  static_gtfs_url: https://api.wmata.com/gtfs/bus-gtfs-static.zip
  static_gtfs_params: {}
collector:
  tick_sec: 30
  trip_updates_every_ticks: 1
  vehicle_positions_every_ticks: 2
  archive_dir: archive/raw_snapshots
  vp_archive_dir: archive/vp_snapshots
  pid_file: logs/collector.pid
  heartbeat_name: combined
database:
  url_env: DATABASE_URL
healthcheck:
  url_env: COLLECTOR_HEALTHCHECK_URL
s3:
  bucket: wmata-dashboard-backups
  tu_prefix: raw-jsonl-archive/
  vp_prefix: raw-jsonl-archive/vp/
# Local-DB retention (docs/DEPLOYMENT.md §12.4; pipelines/apply_retention.py).
# stop_level_days: stop_events + runs, counted back from the latest fully
#   derived service date — deep tier: views allow 90-day windows, plus margin.
# raw_days: vehicle_positions + trip_update_state — only needed until a date
#   is derived (VP window reaches local midnight D+2) plus a rerun buffer;
#   older dates reload from S3. Daily aggregates are kept forever.
# apply_after_refresh: run retention at the end of refresh_by_day (default
#   off — DB deletes need the owner's opt-in).
retention:
  stop_level_days: 100
  raw_days: 7
  apply_after_refresh: false
