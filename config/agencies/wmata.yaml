# Documents the WMATA collector's current implicit settings. Consumed by
# scripts/stateless_collector.py (the NOTES-95 multi-agency rewrite); the
# legacy scripts/continuous_combined_collector.py still doesn't read it.
name: wmata
display_name: WMATA Metrobus
timezone: America/New_York
api:
  key_env: WMATA_API_KEY
  auth: header
  trip_updates_url: https://api.wmata.com/gtfs/bus-gtfsrt-tripupdates.pb
  vehicle_positions_url: https://api.wmata.com/gtfs/bus-gtfsrt-vehiclepositions.pb
  extra_params: {}
  static_gtfs_url: https://api.wmata.com/gtfs/bus-gtfs-static.zip
  static_gtfs_params: {}
collector:
  tick_sec: 30
  trip_updates_every_ticks: 1
  vehicle_positions_every_ticks: 2
  archive_dir: archive/raw_snapshots
  vp_archive_dir: archive/vp_snapshots
  pid_file: logs/collector.pid
  heartbeat_name: combined
database:
  url_env: DATABASE_URL
healthcheck:
  url_env: COLLECTOR_HEALTHCHECK_URL
s3:
  bucket: wmata-dashboard-backups
  tu_prefix: raw-jsonl-archive/
  vp_prefix: raw-jsonl-archive/vp/
