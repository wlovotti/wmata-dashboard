[project]
name = "wmata-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "polars>=1.0.0",
    "zstandard>=0.25.0",
    "boto3>=1.43.9",
    "pyarrow>=24.0.0",
    # SQLAlchemy's default `postgresql://` driver. Core, not an extra:
    # src/database.py requires Postgres everywhere (no SQLite fallback), so
    # every entry point needs it. As an optional extra it was silently
    # dropped whenever uv rebuilt the venv via a bare `uv run` / `uv sync`
    # (the 2026-10-25 gtfs-reload failure, see PR for issue #258).
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
# Kept so existing `uv sync --extra postgres` invocations (CI, docs) keep
# working; psycopg2-binary itself is now a core dependency above.
postgres = [
    "psycopg>=3.1.0",
    "psycopg2-binary>=2.9.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",  # For testing FastAPI endpoints
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "smoke: Quick smoke tests for critical functionality",
    "integration: Integration tests requiring database",
    "api: API endpoint tests",
    "slow: Tests that take longer than 1 second",
    "pg: Tests that require a live Postgres connection (PG_TEST_DATABASE_URL)",
]
